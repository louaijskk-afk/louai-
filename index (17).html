<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louai Daoud — Entrepreneur algérien</title>
<meta name="description" content="Louai Daoud, entrepreneur algérien de 18 ans : business, marketing, stratégie. Consultation gratuite sur WhatsApp.">
<meta property="og:title" content="Louai Daoud — Entrepreneur algérien">
<meta property="og:description" content="Business, marketing, stratégie. Consultation gratuite sur WhatsApp.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06110c;--card:#0c1e15;--text:#eef5f0;--muted:#9bb3a4;--border:#1d3a2a;--accent:#47ff86;
--fh:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Instrument Sans",system-ui,sans-serif;
--sl:max(20px,env(safe-area-inset-left));--sr:max(20px,env(safe-area-inset-right))}
html[lang="ar"]{--fh:"Cairo",system-ui,sans-serif;--fb:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--fh);line-height:1.05;letter-spacing:-.02em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.3}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1140px;margin:0 auto;padding-left:var(--sl);padding-right:var(--sr)}
section{padding:80px 0;border-top:1px solid var(--border)}
.eyebrow{color:var(--accent);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
html[lang="ar"] .eyebrow{letter-spacing:0}
h2{font-size:clamp(32px,5vw,52px);margin-bottom:36px}
.muted{color:var(--muted)}
/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(6,17,12,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;text-decoration:none}
.logo span{color:var(--accent)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font:600 16px var(--fb);text-decoration:none;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);box-shadow:0 8px 30px -8px rgba(71,255,134,.55)}
.btn-primary:hover{background:#6bff9e}
.lang{min-height:40px;padding:0 18px;font-size:14px}
/* hero */
.hero{border-top:0;padding:40px 0 80px}
.hero .wrap{display:grid;gap:40px;align-items:center}
.photo{position:relative;justify-self:center;width:min(100%,420px);animation:fade 1.2s ease both}
.photo::before{content:"";position:absolute;inset:8%;background:var(--accent);filter:blur(70px);opacity:.28;border-radius:50%;z-index:-1}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;border:1px solid var(--border)}
@keyframes fade{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.hero h1{font-size:clamp(56px,11vw,128px);font-weight:800;margin-bottom:22px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:34ch;margin-bottom:32px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
/* stats */
.stats{display:grid;gap:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(48px,7vw,72px);color:var(--accent);line-height:1;margin-bottom:10px}
/* projects */
.projects{list-style:none;border-top:1px solid var(--border)}
.projects a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 4px;border-bottom:1px solid var(--border);text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(24px,4vw,40px);font-weight:700;transition:color .2s,padding .2s}
.projects a:hover{color:var(--accent);padding-inline-start:14px}
.projects .n{direction:ltr;unicode-bidi:isolate}
.arrow{color:var(--accent);font-size:.7em}
html[dir="rtl"] .arrow{transform:scaleX(-1)}
/* cards */
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:28px}
.icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#12402a,#0a2016);border:1px solid var(--border);margin-bottom:22px}
.icon svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:24px;margin-bottom:8px}
.about p{font-family:var(--fh);font-size:clamp(26px,3.6vw,42px);line-height:1.3;max-width:24ch;font-weight:500}
.step{border-top:3px solid var(--accent)}
.step .num{font-family:"Bricolage Grotesque",sans-serif;color:var(--accent);font-weight:700;margin-bottom:12px}
/* contact */
.contact{display:grid;gap:36px;padding:clamp(28px,5vw,56px)}
.contact h2{margin-bottom:16px}
.links{margin-top:28px;display:grid;gap:12px}
.links a{display:block;text-decoration:none;padding:16px 20px;border:1px solid var(--border);border-radius:20px}
.links a:hover{border-color:var(--accent)}
.links small{display:block;color:var(--muted);font-size:13px}
.links span{direction:ltr;unicode-bidi:isolate;font-weight:600}
form{display:grid;gap:16px}
label{display:grid;gap:8px;font-weight:600;font-size:15px}
input,select,textarea{width:100%;font:inherit;font-weight:400;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:14px 16px;font-size:16px}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
html[dir="rtl"] select{background-position:22px 50%,16px 50%}
footer{border-top:1px solid var(--border);padding:36px 0 calc(36px + env(safe-area-inset-bottom))}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;color:var(--muted)}
footer nav{all:unset;display:flex;gap:20px}
footer a{text-decoration:none}footer a:hover{color:var(--accent)}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){
.hero{padding:80px 0 100px}
.hero .wrap{grid-template-columns:1.2fr 1fr}
.hero .photo{order:2}
.services{grid-template-columns:repeat(6,1fr)}
.services .card{grid-column:span 2}.services .card.wide{grid-column:span 3}
.contact{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
